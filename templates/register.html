{% extends "base.html" %}{% block title %}Create account{% endblock %}
{% block content %}<section class="auth-wrap"><div class="auth-card"><span class="eyebrow">START YOUR JOURNEY</span><h1>Create your account</h1><p class="muted">Your personalized learning space is one step away.</p>
<form method="post" class="form">
<label>Full name<input name="name" required maxlength="100" placeholder="e.g. Rahul Kumar"></label>
<label>Email address<input type="email" name="email" required placeholder="you@example.com"></label>
<label>Password<input type="password" name="password" required minlength="8" placeholder="At least 8 characters"></label>
<button class="button primary full">Create account</button></form><p class="form-foot">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></div></section>{% endblock %}
