{% extends "base.html" %}{% block title %}Log in{% endblock %}
{% block content %}<section class="auth-wrap"><div class="auth-card"><span class="eyebrow">WELCOME BACK</span><h1>Continue learning</h1><p class="muted">Log in to pick up where you left off.</p>
<form method="post" class="form">
<label>Email address<input type="email" name="email" required placeholder="you@example.com"></label>
<label>Password<input type="password" name="password" required placeholder="Your password"></label>
<button class="button primary full">Log in</button></form><p class="form-foot">New here? <a href="{{ url_for('register') }}">Create an account</a></p></div></section>{% endblock %}
